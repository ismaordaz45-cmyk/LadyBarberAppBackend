name: CI Backend

on:
  pull_request:
    branches:
      - develop
      - main
      - release
  push:
    branches:
      - develop
      - main
      - release
  workflow_dispatch:

jobs:
  validate-release-source:
    name: Validación de Rama de Release hacia Main
    runs-on: ubuntu-latest
    steps:
      - name: Validar origen de Pull Request
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          echo "Evaluando contexto del evento..."
          echo "Evento: $EVENT_NAME"
          echo "Rama base: $BASE_REF"
          echo "Rama origen: $HEAD_REF"

          # 1. Si no es un Pull Request hacia main, la validación de release no aplica
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$BASE_REF" != "main" ]; then
            echo "La validación de origen para 'main' no aplica para el evento '$EVENT_NAME' con destino '$BASE_REF'."
            echo "Comprobación completada exitosamente sin restricciones para este flujo."
            exit 0
          fi

          echo "Detectado Pull Request con destino a 'main'. Ejecutando validación estricta de origen..."

          # 2. Validar que proceda del mismo repositorio (no de un fork)
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Violación de seguridad: El Pull Request hacia 'main' no procede del repositorio oficial ($BASE_REPO)."
            exit 1
          fi

          # 3. Validar que la rama origen sea exclusivamente la rama oficial release
          if [ "$HEAD_REF" != "release" ]; then
            echo "::error::Violación del flujo: Los Pull Requests dirigidos a 'main' deben provenir exclusivamente de la rama oficial 'release' (recibido: '$HEAD_REF'). PRs directos desde 'feature/*', 'develop' o ramas de versión no autorizadas están estrictamente prohibidos."
            exit 1
          fi

          echo "Validación superada: La rama '$HEAD_REF' procede del repositorio oficial y corresponde a la rama oficial de Release."

  test:
    name: Pruebas Unitarias y API
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      INTEGRATION_DB_CONFIRMATION: lady_barber_test_ephemeral_only
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: lady_barber_ci
      DB_PASSWORD: ci_only_not_a_real_password
      DB_NAME: lady_barber_test
      JWT_SECRET: ci_only_jwt_secret_not_for_external_use

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lady_barber_test
          MYSQL_USER: lady_barber_ci
          MYSQL_PASSWORD: ci_only_not_a_real_password
          MYSQL_ROOT_PASSWORD: ci_only_root_password_discarded_after_job
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Ejecutar prueba de integración MySQL
        run: npm run test:integration
